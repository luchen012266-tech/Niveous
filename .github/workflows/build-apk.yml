name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 智能解压：支持直接往仓库根目录上传 zip 压缩包（免解压直接打包）
      # ---------------------------------------------------------------
      - name: 检测并自动解压 ZIP 压缩包
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo ">>> 发现上传的压缩包: $ZIP_FILE，正在自动解压..."
            unzip -o -q "$ZIP_FILE"
            if [ -d "ao3_reader" ]; then
              echo ">>> 同步 ao3_reader 目录到工程根目录..."
              cp -rf ao3_reader/* . 2>/dev/null || true
              cp -rf ao3_reader/.* . 2>/dev/null || true
            fi
            echo ">>> 解压完成！"
          else
            echo ">>> 未检测到 zip 压缩包，直接使用仓库内现有源码构建"
          fi
          ls -la pubspec.yaml android/key.properties

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "使用 GitHub Secrets 里的签名文件"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ao3-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ao3-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "使用仓库内置签名文件（android/key.properties）"
          fi
          ls -la android/key.properties android/app/ao3-release.jks

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 编译 Release APK
        run: |
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: 检查签名（确认不是 debug 签名）
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5 || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
