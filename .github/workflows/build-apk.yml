name: Build APK

# 三种触发方式：
# 1) 你往仓库里提交/上传文件后自动跑
# 2) 在 Actions 页面点 "Run workflow" 手动跑
# 3) 发 Release 时跑（可选）
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # ---------------------------------------------------------------
      # 签名：
      # 默认直接用仓库里的 android/key.properties + android/app/ao3-release.jks
      # （私有仓库、免配置，第一次编译出来的包以后就能一直覆盖安装）
      #
      # 如果你想改成用 GitHub Secrets（更安全），去 Settings → Secrets and
      # variables → Actions 里加这 4 个 secret，下面的步骤会自动覆盖掉仓库里的文件：
      #   KEYSTORE_BASE64   （keystore 文件的 base64）
      #   STORE_PASSWORD
      #   KEY_PASSWORD
      #   KEY_ALIAS
      # ---------------------------------------------------------------
      - name: 配置签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "使用 GitHub Secrets 里的签名文件"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ao3-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=ao3-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "使用仓库内置签名文件（android/key.properties）"
          fi
          ls -la android/key.properties android/app/ao3-release.jks

      - name: 拉依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 编译 Release APK
        # build-number 用 Actions 的序号，保证每次都递增 → 能直接覆盖安装
        run: |
          flutter build apk --release \
            --build-name=0.1.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: 检查签名（确认不是 debug 签名）
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          # apksigner 在 Android SDK build-tools 里
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5 || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
